version: "3.8"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: blink
      POSTGRES_DB: blink
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "127.0.0.1:54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d blink"]
      interval: 2s
      timeout: 3s
      retries: 40
    tmpfs:
      - /var/lib/postgresql/data

  rest:
    image: postgrest/postgrest:v12.2.3
    environment:
      PGRST_DB_URI: postgres://postgres:blink@db:5432/blink
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: blink-simulacion-local-no-usar-en-produccion
      PGRST_SERVER_PORT: 3000
      PGRST_LOG_LEVEL: error

  api:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:54321:80"
